name: release
on:
  workflow_dispatch:
  push:
    tags: [ 'aura-v*' ]
permissions:
  contents: read
jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-none-softfloat
      - name: Build Aura
        run: make -j2 ARCH=aarch64-linux-gnu- RELEASE=1 CHAINLOADING=1
      - uses: actions/upload-artifact@v7
        with:
          name: aura-${{ github.ref_name }}
          path: |
            build/aura.bin
            build/aura.macho
            LICENSE
            LICENSES/
            3rdparty_licenses/
